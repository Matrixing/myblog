{{- if not (.Param "hideFooter") }}
<footer class="footer">
    <span>&copy; {{ now.Year }} {{ site.Title | upper }}</span>
    <span class="footer__links">
        <a href="{{ "index.xml" | relLangURL }}">RSS</a>
        {{- with site.Params.socialIcons }}
        {{- range . }}
        {{- if eq .name "github" }}
        <a href="{{ .url }}" rel="noopener" target="_blank">GitHub</a>
        {{- end }}
        {{- end }}
        {{- end }}
        <span class="footer__credits">Powered by <a href="https://gohugo.io/">Hugo</a> &amp; <a href="https://github.com/adityatelange/hugo-PaperMod/">PaperMod</a></span>
    </span>
</footer>
{{- end }}
