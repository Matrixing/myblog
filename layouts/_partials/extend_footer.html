{{- /* 主题切换：圆形扩散动画（View Transitions API） */ -}}
{{- if (not site.Params.disableThemeToggle) }}
<script>
(() => {
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;

    const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setTheme(theme) {
        root.dataset.theme = theme;
        try { localStorage.setItem('pref-theme', theme); } catch (e) { }
    }

    // 捕获阶段拦截，阻止主题自带的瞬时切换
    document.addEventListener('click', (e) => {
        const target = e.target instanceof Element ? e.target.closest('#theme-toggle') : null;
        if (!target) return;

        e.preventDefault();
        e.stopPropagation();

        const current = root.dataset.theme === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';

        // 不支持 View Transitions 或用户偏好减少动效：直接切换
        if (!document.startViewTransition || reduceMotion()) {
            setTheme(next);
            return;
        }

        // 扩散圆心：鼠标点击处；键盘触发则取按钮中心
        let x = e.clientX, y = e.clientY;
        if (e.detail === 0 || (x === 0 && y === 0)) {
            const r = target.getBoundingClientRect();
            x = r.left + r.width / 2;
            y = r.top + r.height / 2;
        }

        const transition = document.startViewTransition(() => setTheme(next));

        transition.ready.then(() => {
            // 半径取到最远角的距离，保证圆能覆盖整个视口
            const radius = Math.hypot(
                Math.max(x, window.innerWidth - x),
                Math.max(y, window.innerHeight - y)
            );
            root.animate(
                {
                    clipPath: [
                        `circle(0px at ${x}px ${y}px)`,
                        `circle(${radius}px at ${x}px ${y}px)`
                    ]
                },
                {
                    // 对齐 agence3e-etage.com：GSAP power4.inOut @ 0.72s
                    duration: 720,
                    easing: 'cubic-bezier(0.76, 0, 0.24, 1)',
                    pseudoElement: '::view-transition-new(root)'
                }
            );
        }).catch(() => { });
    }, true);
})();
</script>
{{- end }}

{{- /* 全屏分类菜单交互 */ -}}
<script>
(() => {
    const menu = document.getElementById('site-menu');
    const openBtn = document.getElementById('menu-open');
    const closeBtn = document.getElementById('menu-close');
    const clock = document.getElementById('menu-clock');
    if (!menu || !openBtn || !closeBtn) return;

    const pad = (n) => String(n).padStart(2, '0');
    let timer = null;

    function tick() {
        if (!clock) return;
        const d = new Date();
        const frames = Math.floor((d.getMilliseconds() / 1000) * 25);
        clock.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}:${pad(frames)}`;
    }

    function open() {
        menu.classList.add('is-open');
        document.body.classList.add('menu-locked');
        openBtn.setAttribute('aria-expanded', 'true');
        tick();
        timer = setInterval(tick, 40);
        closeBtn.focus({ preventScroll: true });
    }

    function close() {
        menu.classList.remove('is-open');
        document.body.classList.remove('menu-locked');
        openBtn.setAttribute('aria-expanded', 'false');
        if (timer) { clearInterval(timer); timer = null; }
        openBtn.focus({ preventScroll: true });
    }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('is-open')) close();
    });

    menu.addEventListener('click', (e) => {
        if (e.target === menu) close();
    });

    // 当前所在分类高亮
    const path = location.pathname;
    menu.querySelectorAll('.site-menu__item').forEach((a) => {
        const slug = a.dataset.cat;
        if (slug && path.indexOf('/categories/' + slug) !== -1) a.classList.add('is-active');
    });
})();
</script>

{{- /* 代码块复制按钮（原主题 footer 里的脚本，接管页脚后在此保留） */ -}}
{{- if (and (eq .Kind "page") (.Param "ShowCodeCopyButtons")) }}
<script>
(() => {
    document.querySelectorAll('pre > code').forEach((codeblock) => {
        const container = codeblock.parentNode.parentNode;
        const btn = document.createElement('button');
        btn.classList.add('copy-code');
        btn.textContent = 'copy';
        const done = () => {
            btn.textContent = 'copied!';
            setTimeout(() => { btn.textContent = 'copy'; }, 2000);
        };
        btn.addEventListener('click', () => {
            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
                done();
                return;
            }
            const range = document.createRange();
            range.selectNodeContents(codeblock);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            try { document.execCommand('copy'); done(); } catch (e) { }
            sel.removeRange(range);
        });
        if (container.classList.contains('highlight')) container.appendChild(btn);
        else codeblock.parentNode.appendChild(btn);
    });
})();
</script>
{{- end }}
