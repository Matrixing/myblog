# ============================================================
#  站点基础配置
#  部署到 Cloudflare Pages 后，把 baseURL 改成你的正式域名
#  （先用 https://<项目名>.pages.dev/ 也可以）
# ============================================================
baseURL = "https://exuity.cc/"
locale = "zh-CN"              # Hugo 0.158+ 用 locale 取代 languageCode
defaultContentLanguage = "zh"
title = "exüity"
theme = "piska"

enableRobotsTXT = true
hasCJKLanguage = true     # 中文摘要按字数截断，而不是按空格
summaryLength = 70

pagination.pagerSize = 10

# ---------------- 主题参数 ----------------
[params]
  env = "production"
  defaultTheme = "dark"          # 默认深色
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = false                # 文章目录（已关闭）
  TocOpen = false
  ShowWordCount = true
  disableAnchoredHeadings = true # 标题后的 # 锚点链接
  ShowRssButtonInSectionTermList = true
  comments = false               # 想开评论见 README

  # 首页自我介绍
  [params.homeInfoParams]
    Title = "你好，我是 XXX"
    Content = "这里记录我的折腾笔记：编程、工具和一些乱七八糟的想法。"

  # 社交图标（name 取值见主题 wiki Icons 页）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Matrixing"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"


# ---------------- 分类菜单（右上角 MENU 里的五项） ----------------
[[params.catMenu]]
  name = "Travel"
[[params.catMenu]]
  name = "Waterproof"
[[params.catMenu]]
  name = "Literature"
[[params.catMenu]]
  name = "Technology"
[[params.catMenu]]
  name = "History"

  # 站点标识：手绘鱼形图标 + 站点名
  [params.label]
    icon = "images/logo-lockup.png"
    iconHeight = 52
    text = ""          # 图里已含 exüity 字样，不再重复显示站点名

  # 网站图标（文件在 static/ 下）
  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#0C0B0A"

# ---------------- 导航菜单 ----------------
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30

# ---------------- 输出格式 ----------------
# JSON 用于站内搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---------------- Markdown 渲染 ----------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true                # 允许在 Markdown 里直接写 HTML
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
